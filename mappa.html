<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posizione</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .info-box {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(255, 255, 255, 0.9); padding: 8px 12px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 12px; font-family: monospace; color: #444;
    }
  </style>
</head>
<body>
  <div class="info-box">
    data_center_data_url: <span id="time">connecting...</span>
  </div>
  <div id="map"></div>

  <script>
    // CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
      databaseURL: "https://posizione-live-andrea-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const map = L.map('map').setView([41.9028, 12.4964], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let marker = null;

    db.ref("shared_location").on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const coords = [data.latitude, data.longitude];
        document.getElementById("time").innerText = data.updatedAt || 'sync_active';

        if (!marker) {
          marker = L.marker(coords).addTo(map);
          map.setView(coords, 16);
        } else {
          marker.setLatLng(coords);
          map.panTo(coords);
        }
      }
    });
  </script>
</body>
</html>

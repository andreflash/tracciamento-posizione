<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello di Controllo Posizione</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; background: #f4f5f7; margin: 0; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .btn { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
    .btn-real { background: #28a745; }
    .btn-freeze { background: #ffc107; color: #333; }
    .btn-fake { background: #dc3545; }
    #status { font-weight: bold; padding: 4px 8px; border-radius: 6px; }
    #map { height: 260px; width: 100%; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Trasmettitore Posizione</h2>
    <p>Stato attuale: <span id="status" style="background:#e0e0e0;">INATTIVO</span></p>
    
    <button class="btn btn-real" onclick="setMode('REAL')">📡 Reale (Ogni 5 min quando attivo)</button>
    <button class="btn btn-freeze" onclick="setMode('FROZEN')">⏸️ Congela Posizione Attuale</button>
    <button class="btn btn-fake" onclick="setMode('CUSTOM')">🎭 Trasmetti Posizione Fittizia</button>
  </div>

  <div class="card">
    <h3>Seleziona Posizione Fittizia sulla Mappa</h3>
    <p style="font-size: 13px; color: #666;">Tocca o trascina il pin sulla mappa per scegliere dove far finta di essere:</p>
    <div id="map"></div>
  </div>

  <script>
    // CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
      databaseURL: "https://posizione-live-andrea-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let intervalId = null;
    let currentMode = 'STOP';
    let fakeLat = 41.8902; // Default: Roma
    let fakeLng = 12.4922;

    const map = L.map('map').setView([fakeLat, fakeLng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let fakeMarker = L.marker([fakeLat, fakeLng], {draggable: true}).addTo(map);

    function updateFakeCoords(lat, lng) {
      fakeLat = lat;
      fakeLng = lng;
      fakeMarker.setLatLng([lat, lng]);
    }

    map.on('click', (e) => updateFakeCoords(e.latlng.lat, e.latlng.lng));
    fakeMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      updateFakeCoords(pos.lat, pos.lng);
    });

    function sendData(lat, lng, modeName) {
      db.ref("shared_location").set({
        latitude: lat,
        longitude: lng,
        mode: modeName,
        updatedAt: new Date().toLocaleTimeString()
      });
    }

    function sendRealLocation() {
      if ("geolocation" in navigator && currentMode === 'REAL') {
        navigator.geolocation.getCurrentPosition(
          (p) => sendData(p.coords.latitude, p.coords.longitude, "REALE"),
          (err) => console.error("Errore GPS: " + err.message),
          { enableHighAccuracy: true }
        );
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const statusEl = document.getElementById("status");
      
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }

      if (mode === 'REAL') {
        statusEl.innerText = "REALE (Attivo)";
        statusEl.style.background = "#d4edda";
        statusEl.style.color = "#155724";

        sendRealLocation();
        intervalId = setInterval(sendRealLocation, 300000); // 5 minuti

      } else if (mode === 'FROZEN') {
        statusEl.innerText = "CONGELATO";
        statusEl.style.background = "#fff3cd";
        statusEl.style.color = "#856404";

      } else if (mode === 'CUSTOM') {
        statusEl.innerText = "FITTIZIO (MASCHERATO)";
        statusEl.style.background = "#f8d7da";
        statusEl.style.color = "#721c24";
        
        sendData(fakeLat, fakeLng, "FITTIZIA");
      }
    }

    // RIPARTENZA AUTOMATICA QUANDO LO SCHERMO SI RIACCENDE O SI RITORNA NELL'APP
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentMode === 'REAL') {
        sendRealLocation(); // Invia subito la nuova posizione reale
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(sendRealLocation, 300000); // Riavvia il timer
      }
    });

    // AGGIORNAMENTO AUTOMATICO QUANDO RITORNA LA CONNESSIONE INTERNET
    window.addEventListener("online", () => {
      if (currentMode === 'REAL') {
        sendRealLocation();
      }
    });
  </script>
</body>
</html>
